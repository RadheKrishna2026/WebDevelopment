<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown Editor</title><style>
:root{--bg:#0d1015;--side:#12161d;--line:#29313d;--text:#e8edf5;--muted:#8793a3;--green:#a8f08b;--blue:#91b8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:235px minmax(0,1fr);grid-template-rows:62px minmax(0,1fr)}header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 21px;border-bottom:1px solid var(--line);background:#10141a}.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:-.03em}.logo{width:29px;height:29px;border-radius:8px;background:var(--green);color:#111a15;display:grid;place-items:center}.titlebar{border-left:1px solid #303845;padding-left:17px;color:#aeb8c5;font-size:12px}.topright{margin-left:auto;display:flex;align-items:center;gap:10px}.saved{font-size:11px;color:var(--green)}.btn{border:1px solid #35404d;background:transparent;color:#d9e0e9;border-radius:7px;padding:9px 12px;cursor:pointer;font-size:11px;font-weight:750}.btn:hover{border-color:var(--green);color:var(--green)}.btn.green{background:var(--green);color:#131b15;border-color:var(--green)}aside{background:var(--side);border-right:1px solid var(--line);padding:18px 13px;overflow:auto}.sidehead{display:flex;justify-content:space-between;align-items:center;padding:0 8px;margin-bottom:13px;color:#929eae;font-size:10px;font-weight:900;letter-spacing:.16em}.add{border:1px solid #35404d;color:var(--green);background:transparent;border-radius:6px;width:27px;height:27px;font-size:18px;cursor:pointer}.notes{display:grid;gap:5px}.note{border:1px solid transparent;text-align:left;background:transparent;color:#9ca7b7;border-radius:8px;padding:11px 10px;cursor:pointer;width:100%;display:flex;align-items:start;gap:9px}.note:before{content:"▤";color:#6f7c8c}.note.active{background:#202932;border-color:#303c48;color:#fff}.note.active:before{color:var(--green)}.note strong{display:block;font-weight:650;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:155px}.note small{display:block;font-size:10px;color:#657181;margin-top:4px}.sidefoot{margin-top:24px;padding:13px 9px;border-top:1px solid var(--line);font-size:10px;color:#778395;line-height:1.7}.workspace{min-width:0;min-height:0;display:flex;flex-direction:column}.toolbar{height:53px;display:flex;align-items:center;justify-content:space-between;padding:0 19px;border-bottom:1px solid var(--line);gap:12px}.docname{font-size:13px;font-weight:800}.tools{display:flex;gap:5px}.tool{border:0;background:transparent;color:#96a1b1;padding:7px 9px;border-radius:5px;cursor:pointer;font-size:11px}.tool.active,.tool:hover{background:#242b35;color:var(--green)}.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}.pane{min-width:0;min-height:0;display:flex;flex-direction:column}.pane+.pane{border-left:1px solid var(--line)}.panehead{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#8794a4;font-size:10px;letter-spacing:.13em;font-weight:900;border-bottom:1px solid #202731}.panehead span:last-child{font-size:10px;font-weight:500;letter-spacing:0;color:#647181}.editorwrap{display:flex;flex:1;min-height:0;background:#10141a}.gutter{width:38px;flex-shrink:0;padding:18px 8px;text-align:right;color:#4d5968;font:12px/1.8 ui-monospace,Consolas,monospace;white-space:pre;overflow:hidden;user-select:none}.editor{flex:1;resize:none;background:transparent;border:0;outline:0;color:#cbd6e4;padding:18px 12px 28px 5px;font:13px/1.8 ui-monospace,Consolas,monospace;white-space:pre;overflow:auto;tab-size:2}.preview{padding:22px 29px 40px;overflow:auto;color:#c5ceda;line-height:1.8}.preview h1,.preview h2,.preview h3{color:#eff5fc;letter-spacing:-.045em;line-height:1.2}.preview h1{font-size:29px;border-bottom:1px solid var(--line);padding-bottom:12px}.preview h2{font-size:22px;margin-top:27px}.preview h3{font-size:17px}.preview p{color:#bac5d3}.preview a{color:var(--blue)}.preview strong{color:#f2f6fb}.preview blockquote{border-left:3px solid var(--green);margin:18px 0;padding:4px 0 4px 16px;color:#95a4b6}.preview code{background:#252d38;color:#c8f2ae;padding:2px 5px;border-radius:4px;font:12px ui-monospace,monospace}.preview pre{background:#0b0e13;border:1px solid #26303b;border-radius:9px;padding:15px;overflow:auto}.preview pre code{background:none;padding:0;color:#cae4ff;line-height:1.7}.preview ul,.preview ol{padding-left:24px}.preview li{padding:3px 0}.preview hr{border:0;border-top:1px solid var(--line);margin:24px 0}.status{height:28px;display:flex;align-items:center;gap:15px;padding:0 18px;color:#6d7a8b;border-top:1px solid var(--line);font-size:10px}.status .right{margin-left:auto}.mobiletabs{display:none}@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:57px auto minmax(0,1fr)}header{grid-column:1;padding:0 12px}.titlebar{display:none}aside{grid-row:2;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;max-height:108px}.sidehead{margin-bottom:5px}.notes{display:flex;overflow:auto}.note{min-width:142px;width:auto;padding:7px 9px}.note strong{max-width:120px}.sidefoot{display:none}.workspace{grid-row:3}.toolbar{padding:0 10px;height:45px}.split{grid-template-columns:1fr}.panehead{padding:0 13px}.editor{padding:13px 8px 20px 3px;font-size:12px}.gutter{padding:13px 6px;width:30px}.preview{padding:16px 19px}.preview h1{font-size:25px}.saved{display:none}.tool{padding:7px;font-size:10px}}@media(min-width:761px){.split[data-mode="edit"] .previewpane{display:none}.split[data-mode="preview"] .editorpane{display:none}}
</style>
<style>

</head><body><div class="app"><header><div class="brand"><span class="logo">✳</span> draft<span style="color:var(--green)">/</span></div><div class="titlebar" id="topTitle">Welcome to Draft</div><div class="topright"><span class="saved" id="saveState">● Saved locally</span><button class="btn" id="renameBtn">Rename</button><button class="btn green" id="downloadBtn">Export .md ↓</button></div></header><aside><div class="sidehead"><span>YOUR NOTES</span><button class="add" id="addNote" aria-label="Create note">+</button></div><div class="notes" id="noteList"></div><div class="sidefoot">ABOUT YOUR NOTES<br>Notes are saved in this browser. You can download them as Markdown files.</div></aside><section class="workspace"><div class="toolbar"><div class="docname" id="docName">Welcome to Draft</div><div class="tools"><button class="tool active" data-mode="split">◫ Split</button><button class="tool" data-mode="edit">✎ Edit</button><button class="tool" data-mode="preview">☷ Preview</button></div></div><div class="split" id="split" data-mode="split"><section class="pane editorpane"><div class="panehead"><span>MARKDOWN SOURCE</span><span id="wordCount">0 words</span></div><div class="editorwrap"><div class="gutter" id="gutter">1</div><textarea id="editor" class="editor" spellcheck="false" aria-label="Markdown source" placeholder="Start writing Markdown..."></textarea></div></section><section class="pane previewpane"><div class="panehead"><span>LIVE PREVIEW</span><span>RENDERED OUTPUT</span></div><article class="preview" id="preview"></article></section></div><div class="status"><span>MARKDOWN</span><span id="charCount">0 characters</span><span>Autosave on</span><span class="right">Draft stores locally ↗</span></div></section></div><script>
const KEY='draft-notes-v1';const starter='# Welcome to Draft ✳\n\nA quiet space for your next big idea.\n\n## A tiny Markdown guide\n\nWrite on the left. Your preview updates automatically on the right.\n\n- **Bold text** for important ideas\n- *Italic text* for softer emphasis\n- Lists to organize your thoughts\n- Inline code like `npm run dev`\n\n> Good ideas become great when you write them down.\n\n## A code snippet\n\n```js\nfunction sayHello(name) {\n  return `Hello, ${name}!`;\n}\n```\n\n---\n\nMake a note, rename it, or create a new page with the **+** button. Everything saves automatically in this browser.\n';const $=id=>document.getElementById(id);let notes=[],current='',saveTimer=null,previewTimer=null;try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.notes)&&saved.notes.length){notes=saved.notes;current=saved.current||notes[0].id}}catch(e){}if(!notes.length){notes=[{id:'welcome',title:'Welcome to Draft',content:starter,updated:Date.now()},{id:'ideas',title:'Quick ideas',content:'# Quick ideas\n\n- What problem am I curious about?\n- Who could I learn from?\n- What can I test this week?\n',updated:Date.now()-1000}];current='welcome'}function active(){return notes.find(n=>n.id===current)||notes[0]}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function inline(s){let x=esc(s);x=x.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/_([^_]+)_/g,'<em>$1</em>').replace(/~~(.+?)~~/g,'<del>$1</del>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');return x}function markdown(src){const lines=src.replace(/\r/g,'').split('\n');let out=[],code=false,codeLines=[],ul=false,ol=false,quote=false;function lists(){if(ul){out.push('</ul>');ul=false}if(ol){out.push('</ol>');ol=false}}function blockquote(){if(quote){out.push('</blockquote>');quote=false}}for(const l of lines){if(l.startsWith('```')){lists();blockquote();if(code){out.push('<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>');codeLines=[];code=false}else code=true;continue}if(code){codeLines.push(l);continue}if(/^\s*[-*+]\s+/.test(l)){blockquote();if(ol){out.push('</ol>');ol=false}if(!ul){out.push('<ul>');ul=true}out.push('<li>'+inline(l.replace(/^\s*[-*+]\s+/,''))+'</li>');continue}if(/^\s*\d+\.\s+/.test(l)){blockquote();if(ul){out.push('</ul>');ul=false}if(!ol){out.push('<ol>');ol=true}out.push('<li>'+inline(l.replace(/^\s*\d+\.\s+/,''))+'</li>');continue}lists();if(/^\s*>/.test(l)){if(!quote){out.push('<blockquote>');quote=true}out.push('<p>'+inline(l.replace(/^\s*>\s?/,''))+'</p>');continue}else blockquote();if(/^\s*---+\s*$/.test(l)||/^\s*\*\*\*+\s*$/.test(l)){out.push('<hr>');continue}const h=l.match(/^(#{1,6})\s+(.+)$/);if(h){const n=h[1].length;out.push('<h'+n+'>'+inline(h[2])+'</h'+n+'>');continue}if(l.trim())out.push('<p>'+inline(l)+'</p>')}lists();blockquote();if(code)out.push('<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>');return out.join('\n')||'<p style="color:#687586">Your formatted note will appear here…</p>'}function persist(){try{localStorage.setItem(KEY,JSON.stringify({notes,current}));$('saveState').textContent='● Saved locally'}catch(e){$('saveState').textContent='Storage unavailable'}}function saveCurrent(){const n=active();if(!n)return;n.content=$('editor').value;n.updated=Date.now()}function sidebar(){ $('noteList').innerHTML=notes.map(n=>'<button class="note '+(n.id===current?'active':'')+'" data-id="'+esc(n.id)+'"><span style="min-width:0"><strong>'+esc(n.title||'Untitled note')+'</strong><small>'+new Date(n.updated||Date.now()).toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</small></span></button>').join('');document.querySelectorAll('.note').forEach(b=>b.addEventListener('click',()=>{saveCurrent();persist();current=b.dataset.id;load()}))}function counts(){const s=$('editor').value;$('wordCount').textContent=(s.trim()?s.trim().split(/\s+/).length:0)+' words';$('charCount').textContent=s.length+' characters';$('gutter').textContent=Array.from({length:Math.max(1,s.split('\n').length)},(_,i)=>i+1).join('\n')}function preview(){ $('preview').innerHTML=markdown($('editor').value)}function load(){const n=active();$('topTitle').textContent=n.title;$('docName').textContent=n.title;$('editor').value=n.content;counts();preview();sidebar();persist()}$('editor').addEventListener('input',()=>{saveCurrent();counts();$('saveState').textContent='● Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{persist();sidebar()},250);clearTimeout(previewTimer);previewTimer=setTimeout(preview,50)});$('editor').addEventListener('scroll',()=>$('gutter').style.transform='translateY('+(-$('editor').scrollTop)+'px)');$('addNote').addEventListener('click',()=>{saveCurrent();const id='n-'+Date.now();notes.unshift({id,title:'Untitled note',content:'# Untitled note\n\n',updated:Date.now()});current=id;load();$('editor').focus()});$('renameBtn').addEventListener('click',()=>{const n=active(),v=prompt('Name this note:',n.title);if(v===null)return;n.title=v.trim()||'Untitled note';n.updated=Date.now();load()});$('downloadBtn').addEventListener('click',()=>{saveCurrent();persist();const n=active(),blob=new Blob([n.content],{type:'text/markdown;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(n.title||'note').replace(/[^a-z0-9-_ ]/gi,'').trim().replace(/\s+/g,'-')+'.md';a.click();URL.revokeObjectURL(a.href)});document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>{const mode=b.dataset.mode;$('split').dataset.mode=mode;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x===b))}));load();
</script></body></html>
